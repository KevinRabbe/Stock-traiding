name: lda-relay

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lda-relay.yml"
      - "src/stock_trading/lobbying/**"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lda-relay
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Build rolling official-LDA snapshot
        run: |
          python -m stock_trading.lobbying.relay_snapshot \
            --output "$RUNNER_TEMP/lda_snapshot.json" \
            --lookback-days 14
          sha256sum "$RUNNER_TEMP/lda_snapshot.json"
      - name: Publish single-commit relay branch
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/lda_snapshot.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan lda-feed-stage
          git clean -fdx
          cp "$snapshot" lda_snapshot.json
          cat > README.md <<'EOF'
          # LDA relay snapshot

          This branch is generated by GitHub Actions from the official `https://lda.gov/api/v1` API.
          It contains only a rolling raw-data snapshot used when a local network is blocked by the
          LDA.gov edge/CDN. The branch is force-replaced on each publication to avoid history growth.

          Strategy scoring, company mapping, semantic extraction, and PAPER execution do not run here.
          EOF
          git add README.md lda_snapshot.json
          git commit -m "Refresh LDA relay snapshot"
          git push --force origin HEAD:lda-feed
