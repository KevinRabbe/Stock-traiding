name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest

  windows-package-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Verify IANA timezone data
        run: python -c "from zoneinfo import ZoneInfo; assert str(ZoneInfo('America/New_York')) == 'America/New_York'"
      - name: Verify current SEC archive URL
        run: python -c "from stock_trading.sec import SecClient; assert SecClient.quarterly_archive_url(2012, 1) == 'https://www.sec.gov/files/structureddata/data/insider-transactions-data-sets/2012q1_form345.zip'"
      - name: Verify runtime process lock
        run: python -c "from pathlib import Path; from tempfile import TemporaryDirectory; from stock_trading.live.runtime_lock import FileRuntimeLock; root=TemporaryDirectory(); path=Path(root.name)/'runtime.lock'; first=FileRuntimeLock(path); second=FileRuntimeLock(path); assert first.acquire(); assert not second.acquire(); first.release(); assert second.acquire(); second.release(); root.cleanup()"
      - name: Verify experiment CLI imports
        shell: pwsh
        run: |
          python -W error -m stock_trading.experiments.prepare --help
          python -W error -m stock_trading.experiments.enrich --help
          python -W error -m stock_trading.experiments.lightgbm_strategy_factory_executable_maturity --help
          python -W error -m stock_trading.experiments.lightgbm_strategy_qualify_executable_maturity --help
          python -W error -m stock_trading.experiments.lightgbm_strategy_freeze_executable_maturity --help
          python -W error -m stock_trading.experiments.lightgbm_strategy_freeze_executable_maturity_compat --help
          python -W error -m stock_trading.experiments.freeze_v5_runtime_plugin --help
          python -W error -m stock_trading.live.verify_runtime --help
          python -W error -m stock_trading.live.poll_sec_form4 --help
          python -W error -m stock_trading.live.recover_sec_form4_quarantine --help
          python -W error -m stock_trading.live.run_current_paper_shadow --help
          python -W error -m stock_trading.live.diagnose_current_receipt --help
          python -W error -m stock_trading.live.run_current_pipeline --help
          python -W error -m stock_trading.live.run_current_lda_shadow --help
          python -W error -m stock_trading.live.run_current_usaspending_shadow --help
          python -W error -m stock_trading.live.refresh_forward_outcomes --help

  apply-usaspending-action-freshness:
    if: (github.event_name == 'pull_request' && github.head_ref == 'agent/usaspending-action-freshness') || (github.event_name == 'push' && github.ref == 'refs/heads/agent/usaspending-action-freshness' && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/usaspending-action-freshness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply patch and remove temporary scaffolding
        run: |
          python .github/fix_usaspending_helper_ambiguity.py
          python .github/apply_usaspending_freshness.py
          git checkout origin/main -- .github/workflows/tests.yml
          rm -f .github/fix_usaspending_helper_ambiguity.py
          rm -f .github/apply_usaspending_freshness.py
          rm -f .github/workflows/apply-usaspending-action-freshness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Guard USAspending action freshness and invalidate stale evidence"
          git push origin HEAD:agent/usaspending-action-freshness
