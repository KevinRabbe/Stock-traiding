name: apply-usaspending-action-freshness

on:
  push:
    branches:
      - agent/usaspending-action-freshness

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/usaspending-action-freshness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch and remove temporary scaffolding
        run: |
          python .github/apply_usaspending_freshness.py
          rm .github/apply_usaspending_freshness.py
          rm .github/workflows/apply-usaspending-action-freshness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Guard USAspending action freshness and invalidate stale evidence"
          git push origin HEAD:agent/usaspending-action-freshness
