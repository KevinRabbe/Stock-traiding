[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-traiding"
version = "0.1.0"
description = "Private point-in-time-safe alternative-data trading system"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "exchange-calendars>=4.13.2,<5",
    "httpx>=0.27,<1",
    "lightgbm>=4.7,<5",
    "numpy>=2,<3",
    "pydantic>=2,<3",
    "pytz>=2024.1",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.scripts]
stock-traiding-experiment = "stock_trading.experiments.lightgbm:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"