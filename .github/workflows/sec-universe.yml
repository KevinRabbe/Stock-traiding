name: SEC universe scan

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: First SEC insider-data year to scan
        required: true
        default: "2012"
        type: string
      start_quarter:
        description: First quarter (1-4)
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      START_YEAR: ${{ inputs.start_year }}
      START_QUARTER: ${{ inputs.start_quarter }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify SEC identity secret
        shell: bash
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "SEC_USER_AGENT repository secret is required." >&2
            echo "Set it to an identifying application/contact string before running this workflow." >&2
            exit 1
          fi

      - name: Install
        run: python -m pip install -e .

      - name: Build SEC universe
        shell: bash
        run: |
          python -m stock_trading.experiments.prepare \
            --sec-only \
            --data-root sec-scan-data \
            --start-year "$START_YEAR" \
            --start-quarter "$START_QUARTER" \
            --sec-user-agent "$SEC_USER_AGENT"

      - name: Summarize universe
        shell: bash
        run: |
          echo '## SEC universe scan' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat sec-scan-data/manifests/sec_universe.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload manifests
        uses: actions/upload-artifact@v4
        with:
          name: sec-universe-${{ inputs.start_year }}q${{ inputs.start_quarter }}
          path: sec-scan-data/manifests/
          if-no-files-found: error
          retention-days: 14
